<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · The Athenaeum</title>
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      Deliberately standalone: this is what the service worker serves when the
      network is gone, so it cannot depend on the built stylesheet or on any
      request reaching the server.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfc;
        --heading: #131519;
        --body: #3c424c;
        --muted: #757d8b;
        --accent: #d33127;
        --border: #e4e6ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0c0f;
          --heading: #f2f3f6;
          --body: #c3c7d0;
          --muted: #8b909c;
          --accent: #ff5a4b;
          --border: #24262c;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--body);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 30rem;
        border-top: 1px solid var(--border);
        padding-top: 1.5rem;
      }
      .kicker {
        margin: 0;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0.75rem 0 0;
        font-family: "Fraunces Variable", Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 8vw, 2.75rem);
        font-weight: 600;
        letter-spacing: -0.022em;
        color: var(--heading);
      }
      .lede {
        margin: 0.75rem 0 0;
        font-size: 1.1875rem;
      }
      .hint {
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: var(--accent);
        font-weight: 600;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">The Athenaeum</p>
      <h1>Off the shelf</h1>
      <p class="lede">You're offline, so the reading room is shut for a moment.</p>
      <p class="hint">
        Pages you already opened are still in the browser's cache. Reconnect and the day's edition
        comes back on its own.
      </p>
      <a href="/">Try the front page again</a>
    </main>
  </body>
</html>
